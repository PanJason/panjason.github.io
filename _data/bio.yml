description: |
  I am a Ph.D. candidate in [EDIC Computer and Communication
  Sciences](https://www.epfl.ch/education/phd/edic-computer-and-communication-sciences/)
  at [EPFL](https://www.epfl.ch/en/), advised by [Prof. Sanidhya
  Kashyap](https://sanidhya.github.io/). I received my B.S. in Computer Science
  with summa cum laude from [Turing
  Class](https://cfcs.pku.edu.cn/english/research/turing_program/introduction1/index.htm)
  at Peking University. I also minored in Finance.


  My research focuses on **managing state across the memory hierarchy**, such as
  pages, KV caches, and agent memory, from the OS kernel up to LLM
  agents. Every layer faces the same **trade-off between fetching state and
  regenerating it**, but the right balance differs across layers and shifts
  with the hardware and workload. I tackle it from two sides:

  * **Scalable mechanisms** that move pages through the hierarchy
    without becoming a bottleneck.
  * **Learned policies** that decide what to keep, fetch, or regenerate for the
    workload at hand.

  Along the way, I have built systems at every level of the stack, from memory
  management in the **Linux kernel** to KV cache management for **LLM
  inference** and communication for **LLM pretraining**. I contribute regularly
  to open-source projects such as **SGLang** and Linux (both "kernels", in a
  sense). I am also a member of the Swiss
  [**Apertus**](https://www.swiss-ai.org/apertus) LLM project, where I
  contribute to pretraining mostly through
  [**UCCL**](https://github.com/uccl-project/uccl).
